<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saber-bw</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="browser-container">
        
        <div id="tabs-container">
            <div id="tabs-list"></div>
            <button id="new-tab-btn">+</button>
        </div>

        <div id="workspace">
            <div id="nav-bar">
                <button id="back-btn" class="nav-btn">❪</button>
                <button id="forward-btn" class="nav-btn">❫</button>
                <button id="reload-btn" class="nav-btn">↻</button>
                <input type="text" id="url-input" placeholder="Excalibur ile ara veya URL yaz..." />
                <button id="settings-btn" class="nav-btn">⚙</button>
            </div>

            <div id="content-area">
                
                <div id="newtab-view" class="hidden">
                    <div class="newtab-content">
                        <h1>SABER // BW</h1>
                        <p>Kılıcını kuşan ve internette iz bırak.</p>
                    </div>
                </div>

                <div id="settings-panel" class="hidden">
                    <div class="settings-header">
                        <h3>Saber-bw Ayarları</h3>
                        <button id="close-settings-btn">✕</button>
                    </div>
                    <div class="settings-body">
                        <div class="setting-item">
                            <label for="search-engine-select">Arama Motoru:</label>
                            <select id="search-engine-select">
                                <option value="brave">Brave Search</option>
                                <option value="google">Google</option>
                                <option value="ddg">DuckDuckGo</option>
                            </select>
                        </div>
                        <div class="setting-item" style="margin-top: 12px;">
                            <label for="tabs-position-select">Sekme Düzeni:</label>
                            <select id="tabs-position-select">
                                <option value="top">Üst Bar (Topbar)</option>
                                <option value="side">Yan Bar (Sidebar)</option>
                            </select>
                        </div>
                        <div class="setting-item" style="margin-top: 12px;">
                            <label for="wallpaper-input">Duvar Kağıdı (URL / Yol):</label>
                            <input type="text" id="wallpaper-input" placeholder="https://... veya dosya yolu" />
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
